name: Deploy to Prod
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag to deploy. Empty = current main."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve target
        id: target
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Deploying \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          set -e
          FAIL=$(jq -r '.fail_deploy // "null"' pilot-config.json)
          if [ "$FAIL" = "build" ]; then
            echo "::error::build failed (armed via pilot-config.json)"
            exit 1
          fi
          echo "build ok"

      - name: Reload service
        id: reload
        run: echo "service reloaded on ${{ steps.target.outputs.sha }}"

      - name: Health check
        run: |
          FAIL=$(jq -r '.fail_deploy // "null"' pilot-config.json)
          if [ "$FAIL" = "health" ]; then
            echo "::error::failed /health after deploy"
            exit 1
          fi
          echo "healthy"

      - name: Publish deploy state
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DEPLOYED="not-advanced"
          [ "${{ steps.reload.outcome }}" = "success" ] && DEPLOYED="${{ steps.target.outputs.sha }}"

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          TMP=$(mktemp -d)
          if git clone --depth 1 --branch deploy-state "$REMOTE" "$TMP" 2>/dev/null; then
            cd "$TMP"
          else
            git clone --depth 1 "$REMOTE" "$TMP"
            cd "$TMP"
            git checkout --orphan deploy-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          jq -n --arg d "$DEPLOYED" --arg r "${{ job.status }}" \
                --arg run "${{ github.run_id }}" --arg ts "$(date -u +%FT%TZ)" \
            '{deployed_sha:$d, schema_version:"n/a", last_result:$r, run_id:$run, ts:$ts}' > state.json

          cat state.json >> "$GITHUB_STEP_SUMMARY"

          # Self-documenting: a stray branch holding one JSON file with no shared history is
          # genuinely confusing to stumble on, and this one is protected against deletion.
          cat > README.md <<'MD'
# deploy-state (machine-written)

This is an **orphan branch**. It shares no history with the code and holds no source — only
`state.json`, rewritten by the `Deploy to Prod` workflow once per deploy.

**Do not edit it by hand and do not merge it anywhere.** It is not a release; it is a record of what
the last deploy left running. One commit per deploy, appended forever, on this one branch — no branch
is created per release.

## state.json

| Field | Meaning |
|---|---|
| `deployed_sha` | Code actually serving. `not-advanced` means the deploy failed before the service reloaded. |
| `schema_version` | Commit whose migrations were applied. `n/a` where the repo has no migrations. |
| `last_result` | Conclusion of the deploy run that wrote this. |
| `run_id` | The Actions run, for logs. |
| `ts` | When it was written, UTC. |

**`deployed_sha` and `schema_version` disagreeing is the point.** If the schema advanced and the code
did not, production is running old code against a new schema and no code rollback fixes it. The
release-rollback skill in the infra repo reads exactly this to detect that case.

This file is a workflow's *belief* about production, not production itself. The authoritative version
is a version field on the service's own `/health`; this branch is the stand-in until that exists.

Protected against deletion and non-fast-forward: the rollback runbook trusts it, so it is corrected
by committing forward, never by rewriting.
MD

          git config user.name "pilot-deploy"
          git config user.email "pilot-deploy@users.noreply.github.com"
          git add state.json README.md
          git commit -m "deploy state: ${{ job.status }} @ $DEPLOYED" || exit 0
          git push origin HEAD:deploy-state
